# Serves the output of `npm run build`: index.html and assets/.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app fallback: an address such as /my-registrations is not a
  # file. nginx answers with index.html, and React Router reads the address.
  location / {
    try_files $uri /index.html;
  }
}
